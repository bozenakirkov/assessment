services:

  db:
    image: postgres:16
    container_name: workflow_postgres
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./python-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:16
    container_name: workflow_postgres_test
    environment:
      POSTGRES_DB: workflow_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./python-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: python-service
      dockerfile: Dockerfile
    container_name: workflow_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: workflow_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      LOG_LEVEL: INFO
      CONDUCTOR_API_URL: http://conductor:8080/api

  tests:
    build:
      context: python-service
      dockerfile: Dockerfile
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      DB_HOST: db_test
      DB_NAME: workflow_test_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      PYTHONPATH: /app
    command: pytest -v

  conductor:
    image: conductoross/conductor:latest
    container_name: workflow_conductor
    ports:
      - "8080:8080"   # Conductor API
      - "8127:5000"   # Conductor UI

  conductor-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - conductor
    environment:
      CONDUCTOR_API_URL: http://conductor:8080/api
    volumes:
      - ./conductor:/conductor:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        URL=$$CONDUCTOR_API_URL
        until curl -sf $$URL/metadata/taskdefs > /dev/null; do echo "waiting for conductor"; sleep 3; done
        curl -sS --fail-with-body -X POST $$URL/metadata/taskdefs -H "Content-Type: application/json" \
          -d "[$$(cat /conductor/tasks/validate_payload.json), $$(cat /conductor/tasks/process_payload.json)]"
        curl -sS --fail-with-body -X PUT $$URL/metadata/workflow -H "Content-Type: application/json" \
          -d "[$$(cat /conductor/workflows/validation_workflow.json), $$(cat /conductor/workflows/processing_workflow.json)]"
        echo "conductor definitions registered"
    restart: "no"
    
  conductor-worker:
    build:
      context: ./node-worker
    environment:
      CONDUCTOR_API_URL: http://conductor:8080/api
      API_URL: http://app:5000
      WORKER_ID: payload-worker
    depends_on:
      app:
        condition: service_started
      conductor-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  postgres_test_data: